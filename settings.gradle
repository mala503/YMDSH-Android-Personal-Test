pluginManagement {
    repositories {
        if (System.getenv('YMDSH_MAVEN_BRIDGE')) {
            maven { url System.getenv('YMDSH_MAVEN_BRIDGE'); allowInsecureProtocol = true }
        } else {
            google()
            mavenCentral()
            gradlePluginPortal()
        }
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        if (System.getenv('YMDSH_MAVEN_BRIDGE')) {
            maven { url System.getenv('YMDSH_MAVEN_BRIDGE'); allowInsecureProtocol = true }
        } else {
            google()
            mavenCentral()
            maven { url 'https://jitpack.io' }
            maven { url 'https://maven.mozilla.org/maven2/'
                content { includeGroupByRegex 'org\\.mozilla.*' }
            }
        }
    }
}
rootProject.name = "deepseekharness"
include ':app'
